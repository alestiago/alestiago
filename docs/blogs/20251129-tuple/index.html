<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuples - Alejandro Santiago</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    body {
      font-family: "STIX Two Text", Georgia, "Times New Roman", serif;
      line-height: 1.6;
      padding: 2rem;
      max-width: 720px;
      margin: auto;
      color: #111;
    }
    
    .blog-nav {
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    
    .blog-nav a {
      color: #0366d6;
      text-decoration: none;
      margin-right: 1rem;
    }
    
    .blog-nav a:hover {
      text-decoration: underline;
    }
    
    .blog-header {
      margin-bottom: 0;
    }
    
    .blog-header h1 {
      font-size: 1.6rem;
      margin-bottom: 0.25rem;
      color: #111;
      letter-spacing: 0.01em;
      font-family: "STIX Two Text", Georgia, "Times New Roman", serif;
    }
    
    .blog-subtitle {
      font-size: 1rem;
      color: #444;
      margin-top: 0.25rem;
      margin-bottom: 0.5rem;
    }
    
    .blog-date-row {
      color: #555;
      font-size: 0.9rem;
      margin: 0.6rem 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      font-family: "STIX Two Text", Georgia, "Times New Roman", serif;
    }

    .blog-tags {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .blog-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.1rem 0.5rem;
      border-radius: 9999px;
      border: 1px solid #e1e4e8;
      font-size: 0.8rem;
      color: #444;
      background-color: #f8fafc;
    }
    
    .blog-author {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    
    .blog-author-avatar {
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      object-fit: cover;
      display: inline-block;
    }
    
    .blog-author-name {
      font-weight: 500;
      color: #222;
      font-family: "STIX Two Text", Georgia, "Times New Roman", serif;
    }
    
    .blog-divider {
      border: 0;
      border-top: 1px solid #e1e4e8;
      margin: 0.75rem 0 1.5rem;
    }
    
    .blog-content h1 {
      font-size: 1.5rem;
      margin-top: 2rem;
      margin-bottom: 0.5rem;
      color: #111;
      font-family: "STIX Two Text", Georgia, "Times New Roman", serif;
    }
    
    .blog-content h2 {
      font-size: 1.25rem;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
      color: #111;
      font-family: "STIX Two Text", Georgia, "Times New Roman", serif;
    }
    
    .blog-content h3 {
      font-size: 1.1rem;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
      color: #111;
      font-family: "STIX Two Text", Georgia, "Times New Roman", serif;
    }
    
    .blog-content p {
      margin: 0.6rem 0;
    }
    
    .blog-content pre {
      background-color: #ffffff;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      margin: 1rem 0;
      font-size: 0.9em;
    }
    
    .blog-content code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    
    .blog-content p code,
    .blog-content li code {
      background-color: #ffffff;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
      border: 1px solid #e1e4e8;
    }

    /* Line-numbered code blocks */
    .blog-content .code-block-wrapper {
      position: relative;
      margin: 1rem 0;
    }

    .blog-content .code-block-wrapper pre.code-with-lines {
      position: relative;
      padding: 0;
      overflow-x: auto;
      overflow-y: hidden;
      margin: 0; /* wrapper handles vertical spacing */
    }

    .blog-content .code-block-wrapper.has-filename pre.code-with-lines {
      border-top-left-radius: 0; /* let the filename tab own this corner when present */
    }

    .blog-content pre.code-with-lines code {
      display: block;
      white-space: pre;
      padding: 1em 0 1em 3.25em; /* vertical padding + left gutter */
      line-height: 1.5em;
    }

    .blog-content .code-block-wrapper .code-filename {
      display: inline-block;
      margin: 0 0 -1px 0;  /* visually connect with the pre's top border */
      padding: 0.1em 0.6em;
      font-size: 0.75em;
      color: #666;
      background-color: #ffffff;
      border: 1px solid #e1e4e8;
      border-bottom: none;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      pointer-events: none;
    }

    .blog-content .code-block-wrapper .code-filename.code-filename--linked .code-filename-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3em;
    }

    .blog-content .code-block-wrapper .code-filename .code-filename-link {
      color: inherit;
      text-decoration: none;
      pointer-events: auto; /* allow clicking the link while parent is non-interactive */
    }

    .blog-content .code-block-wrapper .code-filename-favicon {
      width: 0.8em;
      height: 0.8em;
      margin-right: 0;
      object-fit: contain;
      vertical-align: middle;
      opacity: 0.8;
    }

    .blog-content .code-block-wrapper .code-filename .code-filename-link:hover {
      text-decoration: underline;
    }

    .blog-content .code-block-wrapper .code-filename .code-filename-link:hover .code-filename-favicon {
      opacity: 0.55;
    }

    .blog-content pre.code-with-lines .code-line {
      display: block;
      position: relative;
      padding-left: 0.25em;
      line-height: inherit;
    }

    .blog-content pre.code-with-lines .code-line::before {
      position: absolute;
      left: 0;
      width: 2.5em;
      margin-left: -3.25em;
      padding-right: 0.75em;
      text-align: right;
      color: #999;
      content: attr(data-line);
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    .blog-content pre.code-with-lines .code-line.code-ellipsis {
      background-color: #f0f1f3;
      color: #999;
      font-style: italic;
      line-height: 2em;
      margin-left: -3.25em;  /* extend background into gutter area */
      padding-left: 3.5em;   /* keep code text aligned with other lines */
    }

    .blog-content pre.code-with-lines .code-line.code-ellipsis::before {
      color: #999;
      content: '';
    }

    .blog-content pre.code-with-lines .code-line.code-highlight {
      background-color: #e6ffed; /* subtle green highlight */
    }

    .blog-content pre.code-with-lines .code-line.code-highlight.code-highlight-red {
      background-color: #ffeef0; /* subtle red */
    }

    .blog-content pre.code-with-lines .code-line.code-highlight.code-highlight-orange {
      background-color: #fff5e6; /* subtle orange */
    }

    .blog-content pre.code-with-lines .code-line.code-highlight.code-highlight-blue {
      background-color: #e6f7ff; /* subtle blue */
    }
    
  
    .blog-content img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    
    .blog-content blockquote {
      border-left: 3px solid #ddd;
      margin: 1rem 0;
      padding-left: 1rem;
      color: #555;
    }
    
    .blog-content a {
      color: #0366d6;
    }
    
    .blog-content a:hover {
      text-decoration: underline;
    }
    
    .blog-content ul, .blog-content ol {
      margin: 0.6rem 0;
      padding-left: 2rem;
    }
    
    .blog-content li {
      margin: 0.3rem 0;
    }
    
    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      margin: 1rem 0;
    }

    /* Footnotes */
    .blog-content .footnote-ref {
      font-size: 0.75em;
      vertical-align: super;
      line-height: 1;
    }

    .blog-content .footnote-ref a {
      color: inherit;
      text-decoration: none;
    }

    .blog-content .footnote-ref a:hover {
      text-decoration: underline;
    }

    /* Mermaid diagrams */
    .blog-content .mermaid {
      margin: 1.5rem 0;
    }

    /* Ensure edge labels (event names) remain readable on black lines */
    .blog-content .mermaid .edgeLabel {
      background-color: #ffffff;
      padding: 0 0.2em;
      border-radius: 2px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    // Initialize Mermaid for any fenced mermaid code blocks rendered as
    // <div class="mermaid">...</div> by the custom renderer.
    // We use a neutral base theme and override colors to keep diagrams
    // black-and-white so they match the blog's typography.
    if (window.mermaid) {
      window.mermaid.initialize({
        startOnLoad: true,
        theme: 'base',
        themeVariables: {
          background: '#ffffff',
          primaryColor: '#ffffff',
          primaryBorderColor: '#000000',
          primaryTextColor: '#000000',
          lineColor: '#000000',
          secondaryColor: '#ffffff',
          secondaryBorderColor: '#000000',
          secondaryTextColor: '#000000',
          tertiaryColor: '#ffffff',
          tertiaryBorderColor: '#000000',
          tertiaryTextColor: '#000000'
        }
      });
    }
  </script>
</head>
<body>
  <div class="blog-nav">
    <a href="../../index.html">← Home</a>
    <a href="../index.html">← Blog Index</a>
  </div>
  
  <div class="blog-header">
    <h1>Tuples</h1>
    <div class="blog-subtitle">This is an example blog post</div>
    <div class="blog-date-row">
      <span class="blog-author"><img class="blog-author-avatar" src="https://avatars.githubusercontent.com/u/44524995?v=4" alt=""><span class="blog-author-name">Alejandro Santiago</span></span> · 7 min read · Nov 29, 2025
    </div>
    
    <div class="blog-tags">
      <span class="blog-tag">Example</span><span class="blog-tag">Flutter</span>
    </div>
  </div>
  
  <hr class="blog-divider">
  
  <div class="blog-content">
    <p>Hello.</p>

  </div>
</body>
</html>
