<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled - Alejandro Santiago</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      line-height: 1.6;
      padding: 2rem;
      max-width: 720px;
      margin: auto;
      color: #111;
    }
    
    .blog-nav {
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    
    .blog-nav a {
      color: #0366d6;
      text-decoration: none;
      margin-right: 1rem;
    }
    
    .blog-nav a:hover {
      text-decoration: underline;
    }
    
    .blog-header {
      margin-bottom: 2rem;
    }
    
    .blog-header h1 {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
      color: #111;
    }
    
    .blog-date {
      color: #555;
      font-size: 0.9rem;
      margin: 0.6rem 0;
    }
    
    .blog-content h1 {
      font-size: 1.5rem;
      margin-top: 2rem;
      margin-bottom: 0.5rem;
      color: #111;
    }
    
    .blog-content h2 {
      font-size: 1.25rem;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
      color: #111;
    }
    
    .blog-content h3 {
      font-size: 1.1rem;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
      color: #111;
    }
    
    .blog-content p {
      margin: 0.6rem 0;
    }
    
    .blog-content pre {
      background-color: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      margin: 1rem 0;
      font-size: 0.9em;
    }
    
    .blog-content code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    
    .blog-content p code {
      background-color: #f6f8fa;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
      border: 1px solid #e1e4e8;
    }

    /* Line-numbered code blocks */
    .blog-content .code-block-wrapper {
      position: relative;
      margin: 1rem 0;
    }

    .blog-content .code-block-wrapper pre.code-with-lines {
      position: relative;
      padding: 0;
      overflow-x: auto;
      overflow-y: hidden;
      margin: 0; /* wrapper handles vertical spacing */
    }

    .blog-content .code-block-wrapper.has-filename pre.code-with-lines {
      border-top-left-radius: 0; /* let the filename tab own this corner when present */
    }

    .blog-content pre.code-with-lines code {
      display: block;
      white-space: pre;
      padding: 1em 0 1em 3.25em; /* vertical padding + left gutter */
      line-height: 1.5em;
    }

    .blog-content .code-block-wrapper .code-filename {
      display: inline-block;
      margin: 0 0 -1px 0;  /* visually connect with the pre's top border */
      padding: 0.1em 0.6em;
      font-size: 0.75em;
      color: #666;
      background-color: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-bottom: none;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      pointer-events: none;
    }

    .blog-content pre.code-with-lines .code-line {
      display: block;
      position: relative;
      padding-left: 0.25em;
      line-height: inherit;
    }

    .blog-content pre.code-with-lines .code-line::before {
      position: absolute;
      left: 0;
      width: 2.5em;
      margin-left: -3.25em;
      padding-right: 0.75em;
      text-align: right;
      color: #999;
      content: attr(data-line);
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    .blog-content pre.code-with-lines .code-line.code-ellipsis {
      background-color: #f0f1f3;
      color: #999;
      font-style: italic;
      line-height: 2em;
      margin-left: -3.25em;  /* extend background into gutter area */
      padding-left: 3.5em;   /* keep code text aligned with other lines */
    }

    .blog-content pre.code-with-lines .code-line.code-ellipsis::before {
      color: #999;
      content: '';
      counter-increment: none;
    }
    
  
    .blog-content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 1.5rem auto;
    }
    
    .blog-content blockquote {
      border-left: 3px solid #ddd;
      margin: 1rem 0;
      padding-left: 1rem;
      color: #555;
    }
    
    .blog-content a {
      color: #0366d6;
    }
    
    .blog-content a:hover {
      text-decoration: underline;
    }
    
    .blog-content ul, .blog-content ol {
      margin: 0.6rem 0;
      padding-left: 2rem;
    }
    
    .blog-content li {
      margin: 0.3rem 0;
    }
    
    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <div class="blog-nav">
    <a href="../../index.html">← Home</a>
    <a href="../index.html">← Blog Index</a>
  </div>
  
  <div class="blog-header">
    <h1>Untitled</h1>
    <div class="blog-date">November 22, 2025</div>
  </div>
  
  <div class="blog-content">
    <p>Hello world!</p>

  </div>
</body>
</html>
